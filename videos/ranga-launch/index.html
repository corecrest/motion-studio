<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1080,height=1920">
<title>Ranga — Your money. Your move.</title>
<link rel="stylesheet" href="style.css">
<script src="assets/gsap.min.js"></script>
</head>
<body>
<main id="stage" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920" data-fps="30">
  <audio id="sound" src="assets/ranga-sound.m4a" data-start="0" data-duration="25" data-track-index="1"></audio>
  <div id="film" class="clip" data-start="0" data-duration="25" data-track-index="0">
    <section id="opening" class="scene">
      <div class="opening-rule rule"></div>
      <h1><span>Your money.</span><span>Your move.</span></h1>
      <p>Everyday payments and money management</p>
    </section>
    <section id="product" class="scene">
      <div class="copy">
        <div class="rule"></div>
        <h2 id="overview-copy">See where you stand.</h2>
        <h2 id="pay-copy">Make your move.</h2>
        <h2 id="activity-copy">Keep track.</h2>
        <h2 id="plan-copy">See what’s due.</h2>
      </div>
      <div id="device">
        <div class="viewport">
          <img id="home" class="app" src="assets/screens/home.webp" alt="Ranga Home">
          <img id="accounts" class="app" src="assets/screens/accounts.webp" alt="Account balances">
          <img id="pay" class="app" src="assets/screens/pay.webp" alt="Pay with a saved beneficiary">
          <section id="handoff" class="app">
            <div aria-hidden="true">&#8599;&#65038;</div>
            <h3>Continue via USSD</h3>
            <p>Complete the payment in your provider’s USSD menu.</p>
          </section>
          <div id="activity" class="app">
            <img id="activity-body" src="assets/screens/activity.webp" alt="Activity calendar and transaction history">
            <div class="activity-nav"></div>
          </div>
          <img id="receipt" class="app" src="assets/screens/receipt.webp" alt="Recorded grocery expense">
          <img id="planned" class="app" src="assets/screens/planned.webp" alt="Planned payments">
          <img id="plan-detail" class="app" src="assets/screens/plan-detail.webp" alt="Recurring internet payment details">
          <div id="tap" aria-hidden="true"></div>
        </div>
      </div>
      <p class="demo">App walkthrough · Sample data</p>
    </section>
    <div id="wipe"></div>
    <section id="brand" class="scene">
      <img class="brand-icon" src="assets/ranga-icon.png" alt="Ranga icon">
      <div class="brand-rule rule"></div>
      <div class="wordmark-window"><img src="assets/wordmark.png" alt="Ranga"></div>
      <p>Pay. Track. Stay in control.</p>
    </section>
  </div>
</main>
<script src="motion.js"></script>
</body>
</html>
